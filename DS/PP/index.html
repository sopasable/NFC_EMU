e<!-- URL para entrar al juego. Recomendado usar Chrome -->
<!-- En caso de algún error donde no se muestren controles, pantalla, etc. Borrar historial y caché -->
<!-- https://sopasable.github.io/NFC_EMU/DS/PP/ -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
    }

    #game,
    #game canvas {
        width: 100vw;
        height: 100vh;
        touch-action: auto !important;
        pointer-events: auto !important;
    }

    /* Permitir interacción táctil con la pantalla */
    #game {
        touch-action: manipulation !important;
        pointer-events: auto !important;
    }

    #game canvas {
        touch-action: none !important;
        pointer-events: auto !important;
    }

    /* Evita barras de desplazamiento */
    body {
        overflow: hidden;
    }

</style>

</head>

<body>

<div id="game"></div>

<script>
    // Elemento donde se mostrará EmulatorJS
    EJS_player = "#game";

    // Habilitar soporte táctil
    EJS_touch = true;

    // Emulador Nintendo DS
    EJS_core = "nds";

    // ROM
    EJS_gameUrl = "PP.nds";

    // Controles de Nintendo DS
    EJS_controlScheme = 2;

    // Intentar cargar automáticamente el juego
    EJS_startOnLoaded = true;

    // Archivos de EmulatorJS
    EJS_pathtodata = "https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/";
</script>

<script src="https://cdn.jsdelivr.net/gh/ethanaobrien/emulatorjs@main/data/loader.js"></script>

</body>
</html>
